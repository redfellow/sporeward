<div id="sporeward-cleaning-lab">
	<h3>Sporeward · cleaning experiment</h3>
	<div class="viz-controls">
		<label class="form-label">Repeatable scenario
			<select class="form-select" id="sw-scenario"><option value="all">All three tests</option><option value="solo">Solo return route</option><option value="group">Group cleanup and grace</option><option value="split">Crack and split safeguards</option></select>
		</label>
		<button class="btn" type="button" id="sw-test">Run tests</button>
	</div>
	<div id="sw-results" class="text-small" aria-live="polite"></div>
	<div class="viz-controls">
		<label class="form-label">New experiment · initial effort
			<select class="form-select" id="sw-effort"><option value="3">3 visits</option><option value="4" selected>4 visits</option><option value="6">6 visits</option></select>
		</label>
		<label class="form-label">New experiment · repeat cleaning
			<select class="form-select" id="sw-mode"><option value="gentle">100 / 75 / 60 / 50%</option><option value="constant">Constant 100%</option></select>
		</label>
	</div>
	<div class="viz-row text-small tabular-nums" id="sw-clock"></div>
	<svg id="sw-field" role="img" aria-label="Illustrative outbreak shapes showing current cleaning, cracks, splits, and remnants"></svg>
	<div class="viz-row" id="sw-targets" aria-label="Select an outbreak"></div>
	<div class="viz-grid" style="margin:12px 0">
		<div class="card viz-stat"><div>Strength remaining</div><div class="viz-stat-value tabular-nums" id="sw-strength"></div><div class="text-small" id="sw-state"></div></div>
		<div class="card viz-stat"><div>Cleaning committed</div><div class="viz-stat-value tabular-nums" id="sw-pending"></div><div class="text-small" id="sw-more"></div></div>
		<div class="card viz-stat"><div>Selected player’s points</div><div class="viz-stat-value tabular-nums" id="sw-score"></div><div class="text-small" id="sw-bonus"></div></div>
	</div>
	<div class="viz-controls">
		<label class="form-label">Player
			<select class="form-select" id="sw-player"><option value="A">You</option><option value="B">Rider B</option><option value="C">Rider C</option><option value="D">Rider D</option><option value="E">Rider E</option><option value="F">Rider F</option></select>
		</label>
		<label class="form-label">Contact
			<select class="form-select" id="sw-contact"><option value="touch">Edge touch</option><option value="cross">Cross the crack corridor</option></select>
		</label>
		<button class="btn btn-primary" type="button" id="sw-visit">Visit</button>
	</div>
	<div class="text-small tabular-nums" id="sw-next" style="margin:8px 0" aria-live="polite"></div>
	<div class="viz-row" aria-label="Advance simulated time">
		<button class="btn" type="button" data-sw-minutes="5">+5 min</button>
		<button class="btn" type="button" data-sw-minutes="30">+30 min</button>
		<button class="btn" type="button" data-sw-minutes="360">+6 hours</button>
		<button class="btn" type="button" data-sw-minutes="720">+12 hours</button>
		<button class="btn" type="button" data-sw-minutes="1440">+1 day</button>
	</div>
	<div class="text-small" id="sw-events" style="margin-top:12px" aria-live="polite"></div>
	<div class="text-small" style="margin-top:8px">Illustrative outbreak field · cleaning units, not a geographic map</div>
	<h3>Tampere · scenario locations</h3>
	<svg id="sw-map" role="img" aria-label="Tampere OpenStreetMap basemap with illustrative west, central, and east outbreak locations"></svg>
	<div class="text-small">Illustrative targets · connections show visit order, not navigable routes</div>
	<a class="text-small" href="https://www.openstreetmap.org/#map=13/61.498/23.761" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
</div>
<style>
	#sporeward-cleaning-lab #sw-field { display:block; width:100%; height:260px; }
	#sporeward-cleaning-lab #sw-field text { fill:var(--foreground); font-size:12px; }
	#sporeward-cleaning-lab #sw-events > div { margin:4px 0; }
	#sporeward-cleaning-lab #sw-map { display:block; width:100%; height:auto; }
	#sporeward-cleaning-lab #sw-map text { fill:var(--foreground); font-size:12px; }
</style>

	function initial() {
		return Object.assign(SporewardEngine.createWorld({ mode: query("mode").value, effort: Number(query("effort").value) }), {
			player: "A", contact: "touch", selected: "Central", scores: { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 },
			events: ["Three five-cell outbreaks; 100-point cleanup bonus each."]
		});
	}
	function selected() { return state.targets.find(function (o) { return o.id === state.selected; }) || state.targets[0]; }
	function pending(o) { return SporewardEngine.pendingCleaning(o); }
	function duration(minutes) {
		const m = Math.max(0, Math.ceil(minutes));
		if (m < 60) return m + " min";
		return Math.floor(m / 60) + "h" + (m % 60 ? " " + m % 60 + "m" : "");
	}

	function visit(quiet) {

	}
	function advance(minutes, quiet) {

		if (!state.targets.some(function (o) { return o.id === state.selected; })) state.selected = state.targets[0].id;
		if (quiet !== true) { render(); save(); }
	}
	function compactName(id) {
		return id.replace(" · Left", " L").replace(" · Right", " R").replace(" · Remnant ", " R");
	}
	function drawMap() {
		const map = query("map"), w = Math.max(280, root.clientWidth);
		map.setAttribute("viewBox", "0 0 " + w + " " + w);
		map.replaceChildren(element("image", { href: mapImage, width: w, height: w }));

			return state.targets.some(function (o) { return o.id.startsWith(id) && o.visits.length; });
		});
		if (visitedAnchors.length > 1) {

		}

			if (o.id.includes("Right")) point[0] += w * 0.025;

				point[1] += [-0.04, -0.04, 0.04, 0.04][n] * w;
			}

			const colour = o.cleared !== null ? "var(--muted)" : isClearing ? "var(--viz-series-2)" : "var(--viz-series-1)";
			const r = Math.max(5, Math.sqrt(o.cells / 5) * w * 0.026);
			map.append(element("path", { d: path(shapePoints(o, point[0], point[1], r)), fill: colour, "fill-opacity": "0.55", stroke: colour, "stroke-width": 2 }));
			if (o.id === state.selected) map.append(element("circle", { cx: point[0], cy: point[1], r: r + 5, fill: "none", stroke: "var(--foreground)", "stroke-width": 2 }));
		}
		for (const id of ["West", "Central", "East"]) {
			const p = project(anchors[id]);

			const label = element("text", { x: p[0], y: p[1] - 35, "text-anchor": "middle", style: "fill:var(--popover-foreground)" });
			label.textContent = id; map.append(label);
		}
	}
	function scenarioPlan(id) {
		const plans = [], assertions = [];
		function action(label, f) { plans.push({ label: label, run: f }); }
		function check(label, f) {
			plans.push({ label: label, run: function () { const ok = Boolean(f()); assertions.push({ label: label, passed: ok }); if (!ok) throw new Error(label); } });
		}
		function target(name) { return state.targets.find(function (o) { return o.id === name; }); }
		function touch(player, name, cross) {
			action(names[player] + " visits " + name, function () { state.player = player; state.selected = name; state.contact = cross ? "cross" : "touch"; visit(true); });
		}
		function time(minutes) { action("Advance " + duration(minutes), function () { advance(minutes, true); }); }
		const difficulty = id === "split" ? 6 : 4;
		query("effort").value = String(difficulty); query("mode").value = "gentle";
		state = initial(); state.rng = id === "split" ? 2000 : 73;
		if (id === "solo") {
			touch("A", "West"); time(30); touch("A", "Central"); time(30); touch("A", "East");
			check("Three distinct targets give 300 visit points", function () { return state.scores.A === 300; });
			touch("A", "West");
			check("Early revisit gives no points or extra treatment", function () { return state.scores.A === 300 && target("West").visits.length === 1; });
			time(300); touch("A", "West");
			check("Six-hour revisit gives 50 points", function () { return state.scores.A === 350; });
			check("Repeat treatment retains 75% strength", function () { const t = target("West").treatments.at(-1); return Math.abs(t.fast + t.slow - 0.75) < 0.000001; });
			check("Unrelated target retains its own cooldown", function () { return nextValues(target("East"), "A").wait === 60; });
		} else if (id === "group") {
			for (const name of ["West", "Central"]) for (const player of ["A", "B", "C", "D"]) touch(player, name);
			check("Group visits commit treatment without instant destruction", function () { return target("West").strength === 4 && pending(target("West")) === 4; });
			time(720);
			check("Both visited outbreaks clear", function () { return target("West").cleared !== null && target("Central").cleared !== null; });
			check("All four riders share both cleanup bonuses", function () { return ["A", "B", "C", "D"].every(function (p) { return state.scores[p] === 400; }); });
			check("Unvisited East outbreak keeps growing", function () { return target("East").strength > 4 && target("East").cleared === null; });
			touch("E", "West"); touch("E", "West");
			check("Grace arrival gets full points exactly once", function () { return state.scores.E === 200; });
			time(11); touch("F", "West");
			check("Expired protection window rejects arrival", function () { return state.scores.F === 0; });
		} else {
			touch("A", "Central"); touch("B", "East");
			for (const p of ["A", "B", "C", "D"]) touch(p, "West", true);
			check("Seeded fourth corridor crossing splits West", function () { return Boolean(target("West · Left") && target("West · Right")); });
			check("Children preserve total bonus and committed cleaning", function () { const a = target("West · Left"), b = target("West · Right"); return a.bonus + b.bonus === 100 && Math.abs(pending(a) + pending(b) - 4) < 0.000001; });
			time(29); touch("E", "West · Left");
			check("Stabilization blocks new riders and pauses treatment", function () { return state.scores.E === 0 && Math.abs(pending(target("West · Left")) - 2) < 0.000001; });
			time(1); touch("A", "West · Left");
			check("Recent visitor keeps inherited cooldown", function () { return state.scores.A === 200; });
			touch("E", "West · Left");
			check("Fresh rider can visit after stabilization", function () { return state.scores.E === 100; });
			time(330); touch("A", "West · Right");
			check("Original cooldown expiry allows 50-point revisit", function () { return state.scores.A === 250; });
		}
		return { steps: plans, checks: assertions };
	}
	function resultView() {
		query("results").replaceChildren();
		for (const result of results) {
			const row = document.createElement("div");
			row.textContent = (result.passed ? "PASS" : "FAIL") + " · " + result.name + " · " + result.checks + " checks" + (result.error ? " · " + result.error : "");
			if (!result.passed) row.setAttribute("role", "alert");
			query("results").append(row);
		}
	}
	async function runTests() {
		if (testing) return;
		testing = true; results = []; resultView();
		const chosen = query("scenario").value;
		const ids = chosen === "all" ? ["solo", "group", "split"] : [chosen];
		const titles = { solo: "Solo return route", group: "Group cleanup and grace", split: "Crack and split safeguards" };
		try {
			for (const id of ids) {
				const plan = scenarioPlan(id);
				try {
					for (const step of plan.steps) {
						step.run(); query("test").textContent = "Running " + titles[id];
						render();
						await new Promise(function (resolve) { setTimeout(resolve, 100); });
					}
					results.push({ name: titles[id], passed: true, checks: plan.checks.length });
				} catch (error) {
					results.push({ name: titles[id], passed: false, checks: plan.checks.length, error: error instanceof Error ? error.message : "Unexpected error" });
				}
				resultView();
			}
		} finally { testing = false; query("test").textContent = "Run tests"; render(); save(); }
	}
	function element(tag, attrs) {
		const el = document.createElementNS(ns, tag);
		for (const key in attrs) el.setAttribute(key, attrs[key]);
		return el;
	}
	function shapePoints(o, cx, cy, radius) {
		return Array.from({ length: 64 }, function (_, i) {
			const angle = i / 64 * Math.PI * 2;
			const modulation = 1 + 0.16 * Math.sin(angle * 3 + 0.4) + 0.1 * Math.cos(angle * 5 + o.id.length);
			return [cx + Math.cos(angle) * radius * modulation, cy + Math.sin(angle) * radius * modulation * 0.82];
		});
	}
	function path(points) { return "M" + points.map(function (p) { return p.join(","); }).join("L") + "Z"; }
	function draw() {
		cancelAnimationFrame(animation);
		const w = Math.max(280, root.clientWidth), h = Math.max(260, Math.ceil(state.targets.length / 2) * 130);
		svg.style.height = h + "px";
		svg.setAttribute("viewBox", "0 0 " + w + " " + h);
		svg.replaceChildren();
		const count = state.targets.length, columns = count === 1 ? 1 : 2;
		const rows = Math.ceil(count / columns), tileW = w / columns, tileH = h / rows;
		const transitions = [];
		const newShapes = new Map();
		state.targets.forEach(function (o, i) {
			const cx = (i % columns + 0.5) * tileW, cy = (Math.floor(i / columns) + 0.5) * tileH;
			const maxRadius = Math.min(tileW * 0.35, tileH * 0.36);
			const radius = maxRadius * Math.sqrt(Math.min(1, o.cells / o.cap)) * (o.cleared !== null ? 0.25 : 1);
			const points = shapePoints(o, cx, cy, radius);
			const clearing = status(o) === "Clearing", stabilized = state.time < o.stabilize;
			const fill = o.cleared !== null ? "var(--muted)" : clearing ? "var(--viz-series-2)" : "var(--viz-series-1)";
			const outline = element("path", { d: path(points), fill: fill, "fill-opacity": "0.22", stroke: fill, "stroke-width": "2" });
			if (stabilized) outline.setAttribute("stroke-dasharray", "5 4");
			svg.append(outline);
			transitions.push({ el: outline, from: previousShapes.get(o.id) || points, to: points });
			newShapes.set(o.id, points);
			if (o.crossings > 0 && o.cleared === null && !o.remnant) {
				svg.append(element("path", { d: "M" + (cx - radius * 0.75) + "," + (cy + radius * 0.2) + "Q" + cx + "," + (cy - radius * 0.22) + " " + (cx + radius * 0.78) + "," + cy,
					fill: "none", stroke: "var(--background)", "stroke-width": String(Math.min(9, o.crossings * 2)), "stroke-linecap": "round" }));
			}
			const label = element("text", { x: cx, y: cy + maxRadius + 20, "text-anchor": "middle" });
			label.textContent = compactName(o.id) + (stabilized ? " · paused" : clearing ? " · clearing" : "");
			svg.append(label);
		});
		if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
			const started = performance.now();
			function frame(now) {
				const t = Math.min(1, (now - started) / 260);
				for (const item of transitions) {
					item.el.setAttribute("d", path(item.to.map(function (p, i) { return [item.from[i][0] + (p[0] - item.from[i][0]) * t, item.from[i][1] + (p[1] - item.from[i][1]) * t]; })));
				}
				if (t < 1) animation = requestAnimationFrame(frame);
			}
			animation = requestAnimationFrame(frame);
		}
		previousShapes = newShapes;
		drawMap();
	}
	function render() {
		const o = selected(), v = nextValues(o, state.player);
		query("player").value = state.player;
		query("contact").value = state.contact;
		query("test").disabled = testing;
		for (const control of root.querySelectorAll("select, [data-sw-minutes]")) control.disabled = testing;
		query("clock").textContent = "Day " + (Math.floor(state.time / 1440) + 1) + " · " + duration(state.time % 1440) + " elapsed today";
		query("strength").textContent = Math.max(0, o.strength).toFixed(2) + " units";
		query("state").textContent = status(o);
		query("pending").textContent = pending(o).toFixed(2) + " units";
		const required = Math.max(0, o.strength - pending(o));
		query("more").textContent = o.cleared !== null ? "No further treatment" : "About " + Math.ceil(required / v.power - 0.000001) + " more visits at next-visit strength";
		query("score").textContent = state.scores[state.player];
		const last = o.visits[o.visits.length - 1];
		const inGroup = last && o.visits.some(function (x) { return x.player === state.player && Math.abs(x.time - last.time) <= 10; });
		query("bonus").textContent = "Cleanup " + o.bonus + " p" + (o.cleared === null && pending(o) >= o.strength && inGroup ? " · potentially pending" : "");
		const wait = Math.max(v.wait, o.stabilize - state.time);
		const expired = o.cleared !== null && state.time > o.cleared + 10;
		query("visit").disabled = testing || wait > 0 || expired;
		query("next").textContent = expired ? "Target no longer accepts visits." : wait > 0 ? "Eligible in " + duration(wait) + " · cooldown/stabilization" : o.remnant ? "Next touch: " + o.bonus + " cleanup points" : "Next visit: +" + v.points + " points · " + Math.round(v.power * 100) + "% cleaning strength (" + v.power.toFixed(2) + " units)";
		query("targets").replaceChildren();
		for (const target of state.targets) {
			const button = document.createElement("button");
			button.type = "button"; button.className = "btn"; button.textContent = target.id;
			button.disabled = testing;
			button.setAttribute("aria-pressed", String(target.id === o.id));
			button.addEventListener("click", function () { state.selected = target.id; render(); save(); });
			query("targets").append(button);
		}
		query("events").replaceChildren();
		for (const message of state.events.slice(-3)) { const div = document.createElement("div"); div.textContent = message; query("events").append(div); }
		draw();
	}
	function save() {
		if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({ modelContent: { timeHours: state.time / 60, mode: state.mode, scores: state.scores, tests: results }, privateContent: { experiment: state, results: results } }).catch(function () {});
	}
	function restore(saved) {
		const data = saved && saved.privateContent && saved.privateContent.experiment;
		if (data && data.version === 3 && Array.isArray(data.targets) && data.targets.length && typeof data.time === "number") {

	query("contact").addEventListener("change", function () { state.contact = this.value; save(); });
	query("effort").addEventListener("change", function () { state = initial(); render(); save(); });
	query("mode").addEventListener("change", function () { state = initial(); render(); save(); });
	root.querySelectorAll("[data-sw-minutes]").forEach(function (b) { b.addEventListener("click", function () { advance(Number(this.dataset.swMinutes)); }); });

	new ResizeObserver(draw).observe(root);
	render();
}());
</script>
