services:
  api:
    build:
      context: ../..
      dockerfile: ops/test-server/Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:3101:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      ACTIVITY_DATA_DIR: /data/activities
    volumes:
      - activity-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health',{headers:{Authorization:'Basic '+Buffer.from(process.env.AUTH_USERNAME+':'+process.env.AUTH_PASSWORD).toString('base64')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  activity-data:
