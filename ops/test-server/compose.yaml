services:
  api:
    build:
      context: ../..
      dockerfile: ops/test-server/Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:3101:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      ACTIVITY_DATA_DIR: /data/activities
      WORLD_DATA_DIR: /data/world
      DATABASE_HOST: database
      DATABASE_USER: sporeward
      DATABASE_NAME: sporeward
      DATABASE_PASSWORD: ${DB_PASSWORD:?Set a separate private DB_PASSWORD}
      WORLD_ID: tampere-field
      ACCOUNT_REALM: field-test
      ACCOUNT_PRIVATE_DIR: /data/private-onboarding
      IMPORT_LEGACY_WORLD: ${IMPORT_LEGACY_WORLD:-0}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - activity-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health',{headers:{Authorization:'Basic '+Buffer.from(process.env.AUTH_USERNAME+':'+process.env.AUTH_PASSWORD).toString('base64')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  database:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: sporeward
      POSTGRES_USER: sporeward
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a separate private DB_PASSWORD}
    volumes:
      - world-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sporeward -d sporeward"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  activity-data:
  world-database:
